name: Release

# Выпуск новой версии: достаточно запушить тег вида v0.2.3.
# Сценарий соберёт подписанные APK обоих приложений и опубликует их в GitHub Releases
# с теми именами файлов, которые ищет автообновление в приложениях.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Версия в теге должна совпасть с diary.version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(grep '^diary.version=' gradle.properties | cut -d= -f2)"
          if [ "$TAG" != "$VER" ]; then
            echo "Тег v$TAG не совпадает с diary.version=$VER в gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Восстановить ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.DIARY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Секрет DIARY_KEYSTORE_BASE64 не задан"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/diary.jks"

      - name: Сборка подписанных release-APK
        env:
          DIARY_KEYSTORE: ${{ runner.temp }}/diary.jks
          DIARY_KEYSTORE_PASSWORD: ${{ secrets.DIARY_KEYSTORE_PASSWORD }}
          DIARY_KEY_ALIAS: ${{ secrets.DIARY_KEY_ALIAS }}
          DIARY_KEY_PASSWORD: ${{ secrets.DIARY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: Проверить, что APK подписаны
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for a in app-training app-nutrition; do
            "$BT/apksigner" verify --print-certs "$a/build/outputs/apk/release/$a-release.apk"
          done

      - name: Удалить ключ с диска
        if: always()
        run: rm -f "$RUNNER_TEMP/diary.jks"

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app-training/build/outputs/apk/release/app-training-release.apk \
            app-nutrition/build/outputs/apk/release/app-nutrition-release.apk \
            --title "${GITHUB_REF_NAME#v}" --generate-notes
